[package]
name = "cognitive-writer"
version = "2.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
pulldown-cmark = "0.12"
dialoguer = "0.11"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
