[package]
name = "cognitive-writer"
version = "3.4.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dotenvy = "0.15"
pulldown-cmark = "0.12"
dialoguer = "0.11"
thiserror = "2"
indicatif = "0.17"
dirs = "5"
pinyin = "0.10"
sha2 = "0.10"
scraper = "0.29"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
pdf-extract = "0.12"

[dev-dependencies]
tempfile = "3"
